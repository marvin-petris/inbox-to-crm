[project]
name = "inbox-to-crm"
version = "0.1.0"
description = "Transforme les mails entrants d'une PME en leads CRM avec brouillon de réponse, après validation humaine."
readme = "README.md"
authors = [
    { name = "Marvin Petris", email = "323107050+marvin-petris@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.7.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
inbox-to-crm = "inbox_to_crm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
